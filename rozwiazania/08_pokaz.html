var plotno = document.getElementById("widok");
var scenaEl = document.getElementById("scena");
var renderer = new THREE.WebGLRenderer({ canvas: plotno, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
var scena = new THREE.Scene();
var kamera = new THREE.PerspectiveCamera(45, 1, 0.5, 2000);
kamera.up.set(0, 0, 1);
kamera.position.set(95, -70, 55);
kamera.lookAt(CEL);
var sterowanie = new OrbitControls(kamera, plotno);
sterowanie.target.copy(CEL);
sterowanie.enableDamping = true;
sterowanie.dampingFactor = 0.08;
sterowanie.autoRotateSpeed = 0.9;
sterowanie.maxPolarAngle = Math.PI * 0.495;
sterowanie.listenToKeyEvents(plotno);   // strzałki przesuwają kamerę, gdy płótno ma ognisko

var swiatloNieba = new THREE.HemisphereLight(0xffffff, 0x2a2e33, 0.9);
scena.add(swiatloNieba);
var swiatloSlonca = new THREE.DirectionalLight(0xffffff, 1.4);
scena.add(swiatloSlonca);

// Kolor z tokenu CSS. three r152+ sam przelicza sRGB z setStyle na przestrzeń
// roboczą renderera, więc drugiej konwersji już nie wołamy - przyciemniłaby barwy.
function kolorCss(nazwa) {
  var css = getComputedStyle(document.documentElement).getPropertyValue(nazwa).trim();
  return new THREE.Color(css || "#808080");
}

var MAT = {
  dzialka: new THREE.LineBasicMaterial({ color: 0xffffff }),
  siatkaTerenu: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 }),
  duch: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }),
  plyty: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }),
  // Obrys kazdej kondygnacji rysowany bez testu glebokosci: kolor werdyktu ma
  // byc czytelny takze przez gesta elewacje, ktora zaslania plyty.
  pierscienie: new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1, depthTest: false, transparent: true, opacity: 0.9 }),
  bryla: new THREE.MeshStandardMaterial({ color: 0xd9d4cc, roughness: 0.65, metalness: 0.05, transparent: true, opacity: 0.35, depthWrite: false }),
  kontury: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }),
  elewacja: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.8, side: THREE.DoubleSide }),
  ramy: new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
};

var grupa = new THREE.Group();
scena.add(grupa);
var obiekty = {};

function podmien(nazwa, obiekt) {
  var stary = obiekty[nazwa];
  if (stary) {
    grupa.remove(stary);
    stary.traverse(function (o) { if (o.geometry) o.geometry.dispose(); });
  }
  obiekty[nazwa] = obiekt || null;
  if (obiekt) grupa.add(obiekt);
}

function geoZPunktow(punkty) {
  var poz = [], i;
  for (i = 0; i < punkty.length; i++) poz.push(punkty[i][0], punkty[i][1], punkty[i][2]);
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(poz, 3));
  return g;
}

// Odcinki zamkniętej łamanej (ostatni punkt wraca do pierwszego).
function odcinkiPetli(punkty, wyjscie) {
  var i, n = punkty.length;
  for (i = 0; i < n; i++) {
    var a = punkty[i], b = punkty[(i + 1) % n];
    wyjscie.push(a, b);
  }
}

function odswiezKolory() {
  trzebaRysowac = true;
  renderer.setClearColor(kolorCss("--scena-tlo"), 1);
  var linia = kolorCss("--linia"), slaby = kolorCss("--tekst-slaby");
  MAT.dzialka.color.copy(linia);
  MAT.siatkaTerenu.color.copy(slaby);
  MAT.duch.color.copy(slaby);
  MAT.kontury.color.copy(slaby);
  MAT.ramy.color.copy(slaby);
  MAT.bryla.color.copy(kolorCss("--bryla"));
  MAT.plyty.color.copy(kolorCss(ostatnie.wszystkoOk ? "--ok" : "--nie"));
  MAT.pierscienie.color.copy(MAT.plyty.color);
  swiatloNieba.groundColor.copy(linia);
}

// Działka 50 x 37 m i siatka terenu co 5 m - rysowane raz.
function zbudujTeren() {
  var naroza = [[0, 0, 0], [50, 0, 0], [50, 37, 0], [0, 37, 0]];
  podmien("dzialka", new THREE.LineLoop(geoZPunktow(naroza), MAT.dzialka));
  var punkty = [], x, y;
  for (x = 5; x < 50; x += 5) punkty.push([x, 0, 0], [x, 37, 0]);
  for (y = 5; y < 37; y += 5) punkty.push([0, y, 0], [50, y, 0]);
  podmien("siatkaTerenu", new THREE.LineSegments(geoZPunktow(punkty), MAT.siatkaTerenu));
}

// Duch pierwotnej masy: pudełko między kolejnymi stropami każdej z siedmiu kondygnacji.
function zbudujDucha() {
  var wiersze = G.DOMYSLNA_MASA.filter(function (r) { return r[0] === "Kondygnacje"; });
  var punkty = [], poprzedni = 0;
  wiersze.forEach(function (r) {
    var x0 = r[1], y0 = r[2], x1 = r[3], y1 = r[4], z = r[5];
    var zDol = z <= 0 ? z : poprzedni, zGora = z <= 0 ? 0 : z;
    if (z > 0) poprzedni = z;
    var dol = [[x0, y0, zDol], [x1, y0, zDol], [x1, y1, zDol], [x0, y1, zDol]];
    var gora = [[x0, y0, zGora], [x1, y0, zGora], [x1, y1, zGora], [x0, y1, zGora]];
    odcinkiPetli(dol, punkty);
    odcinkiPetli(gora, punkty);
    for (var i = 0; i < 4; i++) punkty.push(dol[i], gora[i]);
  });
  var duch = new THREE.LineSegments(geoZPunktow(punkty), MAT.duch);
  duch.visible = stan.pokazDucha;
  podmien("duch", duch);
}

// Płyty kondygnacji: wachlarz trójkątów ze środka krzywej, 2 cm nad stropem.
function geoPlyty(kondygnacje) {
  var poz = [];
  kondygnacje.forEach(function (k) {
    var n = k.krzywa.length, cx = 0, cy = 0, i;
    if (n < 3) return;
    for (i = 0; i < n; i++) { cx += k.krzywa[i][0]; cy += k.krzywa[i][1]; }
    cx /= n; cy /= n;
    var z = k.z + 0.02;
    for (i = 0; i < n; i++) {
      var a = k.krzywa[i], b = k.krzywa[(i + 1) % n];
      poz.push(cx, cy, z, a[0], a[1], z, b[0], b[1], z);
    }
  });
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(poz, 3));
  return g;
}

function przebudujBryle() {
  var czesciowe = { atraktor: [stan.atraktor_x, stan.atraktor_y, stan.atraktor_z] };
  Object.keys(G.DOMYSLNE_BRYLY).forEach(function (k) { czesciowe[k] = stan[k]; });
  var wynik = G.ustawieniaBryly(czesciowe);
  var bryla = G.zbudujBryle(wynik.ust);
  ostatnie.ustB = wynik;
  ostatnie.bryla = bryla;

  if (bryla.siatka.indeksy.length) {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(bryla.siatka.pozycje, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(bryla.siatka.normalne, 3));
    g.setIndex(bryla.siatka.indeksy);
    podmien("bryla", new THREE.Mesh(g, MAT.bryla));
  } else podmien("bryla", null);

  var plyty = new THREE.Mesh(geoPlyty(bryla.kondygnacje), MAT.plyty);
  plyty.renderOrder = 5;
  podmien("plyty", plyty);

  var pierscienie = new THREE.Group();
  bryla.kondygnacje.forEach(function (k) {
    if (k.krzywa.length < 3) return;
    var pkt = k.krzywa.map(function (q) { return [q[0], q[1], k.z]; });
    var petla = new THREE.LineLoop(geoZPunktow(pkt), MAT.pierscienie);
    petla.renderOrder = 6;
    pierscienie.add(petla);
  });
  podmien("pierscienie", pierscienie.children.length ? pierscienie : null);

  var odcinki = [];
  bryla.kontury.forEach(function (k) { odcinkiPetli(k, odcinki); });
  podmien("kontury", odcinki.length ? new THREE.LineSegments(geoZPunktow(odcinki), MAT.kontury) : null);
}

function przebudujElewacje() {
  var bryla = ostatnie.bryla;
  var czesciowe = {};
  Object.keys(G.DOMYSLNE_ELEWACJI).forEach(function (k) { czesciowe[k] = stan[k]; });
  czesciowe.zasieg_atraktora_m = stan.zasieg_atraktora_e_m;
  var wynik = G.ustawieniaElewacji(czesciowe);
  // Pojedynczy zaznaczony kolor idzie dalej sam: blok GEOMETRIA zostawia wtedy
  // paletę i dopisuje o tym uwagę, a odcięcie go tutaj gasiło tę uwagę.
  var jasny = stan.kolor_jasny ? naRgb(stan.kolor_jasny) : null;
  var ciemny = stan.kolor_ciemny ? naRgb(stan.kolor_ciemny) : null;
  var wlasne = !!(jasny && ciemny);
  var elewacja = G.zbudujElewacje(bryla, wynik.ust, [[stan.atraktor_e_x, stan.atraktor_e_y, stan.atraktor_e_z]], jasny, ciemny);
  ostatnie.ustE = wynik;
  ostatnie.elewacja = elewacja;
  ostatnie.wlasne = wlasne;

  var p = elewacja.panele;
  if (p.indeksy.length) {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(p.pozycje, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(p.normalne, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(p.kolory, 3));
    g.setIndex(p.indeksy);
    podmien("elewacja", new THREE.Mesh(g, MAT.elewacja));
  } else podmien("elewacja", null);
  var pelnaPowloka = !p.indeksy.length;
  MAT.bryla.opacity = pelnaPowloka ? 1.0 : 0.35;
  MAT.bryla.depthWrite = pelnaPowloka;
  // Panele z otworami przepuszczają kolor płyt na całą elewację (miedź czytała
  // się jako łosoś), więc przy nich płyty gasną; werdykt i tak niosą pierścienie.
  MAT.plyty.opacity = (wynik.ust.typ_panelu === 0 || wynik.ust.typ_panelu === 2) ? 0.25 : 0.55;

  if (stan.pokazRamy && elewacja.ramy.length) {
    var odcinki = [];
    elewacja.ramy.forEach(function (rama) {
      for (var i = 0; i + 1 < rama.length; i++) odcinki.push(rama[i], rama[i + 1]);
    });
    podmien("ramy", new THREE.LineSegments(geoZPunktow(odcinki), MAT.ramy));
  } else podmien("ramy", null);

  var s = G.wektorSlonca(wynik.ust.azymut_slonca_deg, wynik.ust.wysokosc_slonca_deg);
  swiatloSlonca.position.set(CEL.x + s[0] * 120, CEL.y + s[1] * 120, CEL.z + s[2] * 120);
}

function naRgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

// ---------------------------------------------------------------------------
// Tabela, werdykt, raport
// ---------------------------------------------------------------------------

function przelicz() {
  var bryla = ostatnie.bryla;
  var kond = bryla.podziemne.map(function (k) { return [k.poleM2, k.z]; })
    .concat(bryla.kondygnacje.map(function (k) { return [k.poleM2, k.z]; }));
  return G.oblicz(DZIALKA_M2, bryla.obrysM2, kond, stan.pbc_grunt_m2, stan.pbc_woda_m2,
    [stan.taras1_m2, stan.taras2_m2], stan.mieszkania, stan.miejsca_podziemne, stan.miejsca_naziemne,
    stan.dach_nachylenie_deg, G.DOMYSLNE_LIMITY);
}

function odswiezTabele(wiersze) {
  var tbody = document.querySelector("#tabela tbody");
  tbody.textContent = "";
  var en = stan.jezyk === "en";
  wiersze.forEach(function (w) {
    var tr = document.createElement("tr");
    [[en ? T().wskazniki[w.wskaznik] || w.wskaznik : w.wskaznik, ""],
     [en ? naAngielski(w.wartosc) : w.wartosc, ""],
     [en ? naAngielski(w.limit) : w.limit, ""],
     [w.ok ? "OK" : "NIE", "wynik " + (w.ok ? "ok" : "nie")],
     [en ? naAngielski(w.margines) : w.margines, "margines"]].forEach(function (para, nr) {
      var td = document.createElement("td");
      td.textContent = para[0];
      if (para[1]) td.className = para[1];
      // Wynik zostaje OK/NIE także po angielsku (format raportu z AGENTS.md); dymek tłumaczy.
      if (nr === 3 && en) td.title = w.ok ? "pass" : "fail";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  // Chipy widać, gdy tabela jest zwinięta: krótka nazwa w kolorze wyniku, pełna
  // nazwa w podpowiedzi, wynik dopisany dla czytnika ekranu.
  var chipy = document.getElementById("chipy");
  chipy.textContent = "";
  wiersze.forEach(function (w, i) {
    var c = document.createElement("span");
    c.className = w.ok ? "ok" : "nie";
    c.textContent = T().skroty[i];
    c.title = en ? T().wskazniki[w.wskaznik] || w.wskaznik : w.wskaznik;
    var wynik = document.createElement("span");
    wynik.className = "sr";
    wynik.textContent = " " + (w.ok ? "OK" : "NIE");
    c.appendChild(wynik);
    chipy.appendChild(c);
  });
  var zle = wiersze.filter(function (w) { return !w.ok; }).length;
  var werdykt = document.getElementById("werdykt");
  werdykt.textContent = wiersze.length === 0 ? ""
    : (zle === 0 ? T().werdykt_ok : wypelnij(T().werdykt_nie, { n: zle, rzecz: rzeczownikWskaznik(zle) }));
  werdykt.className = wiersze.length === 0 ? "" : (zle === 0 ? "ok" : "nie");
}

// Linie raportu bryły i elewacji po angielsku: same podstawienia w szablonach
// z TEKSTY.en.raport, liczby prosto z obiektów dane bloku GEOMETRIA.
function linieEn(bryla, elewacja, ustB, ustE, wlasne) {
  var linie = [], N = TEKSTY.en.nazwy, S = TEKSTY.en.raport;
  var d = bryla.dane, e = elewacja.dane, i;
  if (d && d.pola) {
    var profil = d.profil.typ === 1
      ? wypelnij(S.profil_superelipsa, { nazwa: N.profil[1], w: f1(d.profil.wykladnik) })
      : wypelnij(S.profil_prostokat, { nazwa: N.profil[0], zaokraglenie: f2(d.profil.zaokraglenie) });
    var atraktor = d.atraktor
      ? wypelnij(S.atraktor, { x: f1(d.atraktor.punkt[0]), y: f1(d.atraktor.punkt[1]), z: f1(d.atraktor.punkt[2]),
                               sila: f1(d.atraktor.sila), zasieg: f1(d.atraktor.zasieg) })
      : S.atraktor_brak;
    linie.push(wypelnij(S.profil, { profil: profil, skret: f0(d.skret.deg),
                                    skretTyp: N.skret[d.skret.typ], atraktor: atraktor }));
    for (i = 0; i < d.pola.length; i++) {
      linie.push(wypelnij(S.kondygnacja, { i: i + 1, pole: f1(d.pola[i]), szkic: f1(d.polaSzkicu[i]) }));
    }
    linie.push(wypelnij(S.suma, { suma: f1(d.sumaPo), szkic: f1(d.sumaSzkicu) }));
    linie.push(wypelnij(S.wysokosc, { h: f1(d.wysokoscM), n: d.kondygnacji }));
    linie.push(wypelnij(S.obrys, { a: f1(d.obrysM2) }));
    linie.push(wypelnij(S.objetosc, { v: f0(d.objetoscM3) }));
  }
  if (e && e.wzor !== undefined) {
    var u = ustE.ust;
    linie.push(wypelnij(S.wzor, { wzor: N.wzor[u.typ_wzoru], panel: N.panel[u.typ_panelu] }));
    linie.push(wypelnij(S.paneli, { n: e.paneli, pole: f0(e.poleScianyM2) }));
    if (u.typ_panelu === 1 || u.typ_panelu === 2) {
      linie.push(wypelnij(S.glebokosc, { min: f2(e.glebokoscMinM), max: f2(e.glebokoscMaxM),
                                         zmin: f2(u.glebokosc_min_m), zmax: f2(u.glebokosc_max_m) }));
    }
    if (u.typ_panelu === 0 || u.typ_panelu === 2) {
      linie.push(wypelnij(S.otwory, { min: f2(e.otworMin), max: f2(e.otworMax),
                                      zmin: f2(u.otwor_min), zmax: f2(u.otwor_max) }));
    }
    linie.push(wypelnij(S.mocne, { n: e.mocne, pct: f1(e.udzialPct) }));
    linie.push(wypelnij(u.zasieg_atraktora_m > 0 ? S.atraktory : S.atraktory_bez,
      { n: e.atraktorow, zasieg: f1(e.zasiegM), ws: f2(e.wagaSlonca), wa: f2(e.wagaAtraktora) }));
    linie.push(wypelnij(S.paleta, { nazwa: wlasne ? S.paleta_wlasna : N.paleta[u.paleta] }));
    linie.push(wypelnij(S.powierzchnia, { a: f0(e.powierzchniaM2) }));
    linie.push(S.heurystyka);
  }
  return linie;
}

function odswiezRaport() {
  var bryla = ostatnie.bryla, elewacja = ostatnie.elewacja;
  if (!bryla || !elewacja) return;
  var bezUwag = function (linia) { return linia.indexOf("uwaga: ") !== 0; };
  // Uwagi idą zaraz po linii stałej, przed liczbami: pudełko raportu mieści
  // osiem wierszy, a ostrzeżenie dopisane na końcu nikt nie doczyta ze sceny.
  var uwaga = stan.jezyk === "en" ? "note: " : "uwaga: ";
  var linie = [T().uwaga_pierwsza];
  zmianyZHasha.forEach(function (z) {
    linie.push(uwaga + wypelnij(T().poza_zakresem, z));
  });
  [].concat(ostatnie.ustB.bledy, bryla.bledy, ostatnie.ustE.bledy, elewacja.bledy).forEach(function (b) {
    linie.push(uwaga + b);
  });
  if (stan.jezyk === "en") {
    linie = linie.concat(linieEn(bryla, elewacja, ostatnie.ustB, ostatnie.ustE, ostatnie.wlasne));
  } else {
    linie = linie.concat(bryla.raport.filter(bezUwag)).concat(elewacja.raport.filter(bezUwag));
  }
  document.getElementById("raport").textContent = linie.join("\n");
}

function przelacznik(id, czytaj, pisz) {
  var btn = document.getElementById(id);
  btn.addEventListener("click", function () {
    pisz(!czytaj());
    btn.setAttribute("aria-pressed", czytaj() ? "true" : "false");
    zapiszHash();
  });
  btn.setAttribute("aria-pressed", czytaj() ? "true" : "false");
  return btn;
}

function pokazToast(tekst) {
  var t = document.getElementById("toast");
  t.textContent = tekst;
  t.classList.add("widoczny");
  clearTimeout(pokazToast.licznik);
  pokazToast.licznik = setTimeout(function () { t.classList.remove("widoczny"); }, 2200);
}

var zamiatanieKlatek = 0;

function zatrzymajZamiatanie() {
  if (zamiatanieKlatek <= 0) return false;
  zamiatanieKlatek = 0;
  document.getElementById("btn-slonce").setAttribute("aria-pressed", "false");
  // Przerwany przejazd zostawia azymut w połowie drogi: chip presetu ma to odzwierciedlić.
  zaznaczPreset(presetZeStanu());
  return true;
}

// Chwyt za scene przerywa każdy ruch automatyczny: przejazd słońca i obrót.
function zatrzymajRuch() {
  var zmiana = zatrzymajZamiatanie();
  if (stan.obrot) {
    stan.obrot = false;
    sterowanie.autoRotate = false;
    document.getElementById("btn-obrot").setAttribute("aria-pressed", "false");
    zmiana = true;
  }
  if (zmiana) zapiszHash();
}

function podepnijPrzyciski() {
  document.querySelectorAll("#presety .chip").forEach(function (chip) {
    chip.addEventListener("click", function () { zastosujPreset(chip.getAttribute("data-preset")); });
  });

  document.getElementById("btn-jezyk").addEventListener("click", function () {
    ustawJezyk(stan.jezyk === "pl" ? "en" : "pl");
    zapiszHash();
  });

  document.getElementById("btn-motyw").addEventListener("click", function () {
    stan.motyw = stan.motyw === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", stan.motyw);
    odswiezKolory();
    zapiszHash();
  });

  przelacznik("btn-duch", function () { return stan.pokazDucha; }, function (v) {
    stan.pokazDucha = v;
    if (obiekty.duch) obiekty.duch.visible = v;
    trzebaRysowac = true;
  });

  przelacznik("btn-ramy", function () { return stan.pokazRamy; }, function (v) {
    stan.pokazRamy = v;
    brudne.elewacja = true;
  });

  // Przy ograniczeniu ruchu przycisk zostaje klikalny i tłumaczy się dymkiem:
  // disabled gasiłoby podpowiedź i nikt nie wiedziałby, czemu nic nie rusza.
  var wylacz = function (btn, kluczTekstu) {
    btn.setAttribute("aria-disabled", "true");
    btn.title = T()[kluczTekstu];
    btn.addEventListener("click", function () { pokazToast(T()[kluczTekstu]); });
  };
  var btnObrot = document.getElementById("btn-obrot");
  if (mniejRuchu) {
    wylacz(btnObrot, "btn_obrot_title_off");
  } else {
    przelacznik("btn-obrot", function () { return stan.obrot; }, function (v) {
      stan.obrot = v;
      sterowanie.autoRotate = v;
    });
  }

  // Przejazd słońca to taki sam ruch jak obrót kamery, więc gaśnie razem z nim.
  var btnSlonce = document.getElementById("btn-slonce");
  if (mniejRuchu) {
    wylacz(btnSlonce, "btn_slonce_title_off");
  } else {
    btnSlonce.addEventListener("click", function () {
      if (zamiatanieKlatek > 0) { zatrzymajZamiatanie(); zapiszHash(); return; }
      zamiatanieKlatek = 360;
      btnSlonce.setAttribute("aria-pressed", "true");
    });
  }
  plotno.addEventListener("pointerdown", zatrzymajRuch);

  document.getElementById("btn-link").addEventListener("click", function () {
    zapiszHash();
    var url = location.href;
    var awaryjnie = function () {
      var pole = document.getElementById("schowek"), udalo = false;
      pole.value = url;
      pole.select();
      try { udalo = document.execCommand("copy") === true; } catch (e) { udalo = false; }
      pokazToast(udalo ? T().link_skopiowany : T().link_blad);
      document.getElementById("btn-link").focus();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { pokazToast(T().link_skopiowany); }, awaryjnie);
    } else awaryjnie();
  });

  document.getElementById("btn-png").addEventListener("click", function () {
    renderer.render(scena, kamera);
    renderer.domElement.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "solna-pokaz.png";
      a.click();
      pokazToast(T().png_zapisany);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
  });
}

// ---------------------------------------------------------------------------
// Etykiety ulic, rozmiar, pętla
// ---------------------------------------------------------------------------

var etKdp = document.getElementById("et-kdp");
var etSolna = document.getElementById("et-solna");
var punktEtykiety = new THREE.Vector3();
var kierunekEtykiety = new THREE.Vector3();
var promien = new THREE.Raycaster();

// Etykieta ulicy rzutowana na ekran; gdy bryła stoi między kamerą a zaczepem,
// napis przygasa, żeby było widać, że leży za budynkiem.
function ustawEtykiete(el, x, y, z, szer, wys) {
  punktEtykiety.set(x, y, z);
  var doZaczepu = punktEtykiety.distanceTo(kamera.position);
  kierunekEtykiety.copy(punktEtykiety).sub(kamera.position).normalize();
  var zaslonieta = false;
  if (obiekty.bryla) {
    promien.set(kamera.position, kierunekEtykiety);
    var trafienia = promien.intersectObject(obiekty.bryla, false);
    zaslonieta = trafienia.length > 0 && trafienia[0].distance < doZaczepu;
  }
  punktEtykiety.project(kamera);
  var poza = punktEtykiety.z > 1 || punktEtykiety.z < -1;
  el.style.display = poza ? "none" : "";
  if (poza) return;
  el.style.left = ((punktEtykiety.x * 0.5 + 0.5) * szer).toFixed(1) + "px";
  el.style.top = ((-punktEtykiety.y * 0.5 + 0.5) * wys).toFixed(1) + "px";
  el.style.opacity = zaslonieta ? "0.35" : "1";
}

var szer = 1, wys = 1, trzebaRysowac = true, klatka = 0;

// Jedno przerysowanie: etykiety ulic rzutowane na ekran i klatka sceny.
function rysuj() {
  trzebaRysowac = false;
  ustawEtykiete(etKdp, 25, 41, 0, szer, wys);
  ustawEtykiete(etSolna, -5, 18.5, 0, szer, wys);
  renderer.render(scena, kamera);
  klatka += 1;
  if (klatka === 3) document.documentElement.classList.add("gotowe");
}

// Kamera na starcie: odległość z kuli opisanej na masie (promień 34 m: pół
// przekątnej pudełka 50 x 37 x 24 m z zapasem) i węższego z dwóch kątów widzenia,
// więc masa wypełnia kadr tak samo na projektorze i na telefonie. Tylko raz:
// późniejsze zmiany rozmiaru nie ruszają kamery, którą ktoś już ustawił.
var kameraUstawiona = false;
var KIERUNEK_KAMERY = new THREE.Vector3(70, -88.5, 45).normalize();

function ustawKamere() {
  var pion = THREE.MathUtils.degToRad(kamera.fov) / 2;
  var poziom = Math.atan(Math.tan(pion) * kamera.aspect);
  kamera.position.copy(CEL).addScaledVector(KIERUNEK_KAMERY, 34 / Math.sin(Math.min(pion, poziom)));
  kamera.lookAt(CEL);
}

function dopasujRozmiar() {
  szer = Math.max(scenaEl.clientWidth, 1);
  wys = Math.max(scenaEl.clientHeight, 1);
  renderer.setSize(szer, wys, false);
  kamera.aspect = szer / wys;
  kamera.updateProjectionMatrix();
  if (!kameraUstawiona) { ustawKamere(); kameraUstawiona = true; }
  // Rysujemy od razu, w tym samym zadaniu: zmiana rozmiaru czyści bufor płótna,
  // a czekanie na kolejną ramkę zostawia pustą scenę (widać to przy zmianie
  // okna i łapią to zrzuty ekranu robione zaraz po przeliczeniu układu).
  rysuj();
}

new ResizeObserver(dopasujRozmiar).observe(scenaEl);

function petla() {
  requestAnimationFrame(petla);

  if (zamiatanieKlatek > 0) {
    zamiatanieKlatek--;
    var az = (stan.azymut_slonca_deg + 1) % 360;
    stan.azymut_slonca_deg = az;
    widgety.azymut_slonca_deg.suwak.value = az;
    widgety.azymut_slonca_deg.liczba.value = az;
    brudne.elewacja = true;
    brudne.raport = true;
    if (zamiatanieKlatek === 0) {
      document.getElementById("btn-slonce").setAttribute("aria-pressed", "false");
      zapiszHash();
    }
  }

  if (brudne.bryla || brudne.elewacja || brudne.tabela) trzebaRysowac = true;
  if (brudne.bryla) { przebudujBryle(); brudne.bryla = false; brudne.elewacja = true; brudne.tabela = true; }
  if (brudne.elewacja) { przebudujElewacje(); brudne.elewacja = false; brudne.raport = true; }
  if (brudne.tabela) {
    ostatnie.wiersze = przelicz();
    ostatnie.wszystkoOk = ostatnie.wiersze.every(function (w) { return w.ok; });
    MAT.plyty.color.copy(kolorCss(ostatnie.wszystkoOk ? "--ok" : "--nie"));
    MAT.pierscienie.color.copy(MAT.plyty.color);
    odswiezTabele(ostatnie.wiersze);
    brudne.tabela = false;
    brudne.raport = true;
  }
  if (brudne.raport) { odswiezRaport(); brudne.raport = false; }

  // Rysujemy tylko wtedy, gdy coś się zmieniło: programowy WebGL (headless,
  // maszyny bez karty) nie nadąża z klatką na każdą ramkę, a i bateria wdzięczna.
  if (sterowanie.update()) trzebaRysowac = true;
  if (trzebaRysowac) rysuj();
}

// Wklejenie linku do otwartej strony ma ja przestawic, a nie tylko zmienic adres.
window.addEventListener("hashchange", function () {
  // Trwający przejazd słońca nadpisywałby azymut z nowego linku.
  zatrzymajZamiatanie();
  // Zerujemy przed czytaniem: bez tego klucze, których nowy link nie niesie,
  // zostawałyby z poprzedniego stanu i kolega widziałby inny budynek.
  zerujStan();
  czytajHash();
  document.documentElement.setAttribute("data-theme", stan.motyw);
  odswiezKolory();
  ustawJezyk(stan.jezyk);   // ustawJezyk woła odswiezWidgety()
  document.getElementById("btn-duch").setAttribute("aria-pressed", stan.pokazDucha ? "true" : "false");
  document.getElementById("btn-ramy").setAttribute("aria-pressed", stan.pokazRamy ? "true" : "false");
  if (obiekty.duch) obiekty.duch.visible = stan.pokazDucha;
  wybierzZakladke(stan.zakladka, false);
  zaznaczPreset(presetZeStanu());
  brudne.bryla = true;
  brudne.elewacja = true;
  brudne.tabela = true;
  brudne.raport = true;
});

zbudujKontrolki();
czytajHash();
document.documentElement.setAttribute("data-theme", stan.motyw);
ustawJezyk(stan.jezyk);
wybierzZakladke(stan.zakladka, false);
zaznaczPreset(presetZeStanu());
// Poniżej 1000 px wysokości (projektor 768 px, laptop 900 px) raport i tabela
// startują zwinięte: scena dostaje miejsce raportu, suwaki miejsce tabeli, a
// werdykt z sześcioma chipami zostaje widoczny. Na wąskim ekranie tak samo zwija
// się tabela. Jedno kliknięcie przywraca każde z nich.
var niski = window.innerHeight < 1000;
if (niski) document.getElementById("szczegoly-raportu").open = false;
if (niski || window.innerWidth < 980) document.getElementById("szczegoly-tabeli").open = false;
podepnijZakladki();
podepnijPrzyciski();
odswiezKolory();
zbudujTeren();
zbudujDucha();
dopasujRozmiar();
petla();
